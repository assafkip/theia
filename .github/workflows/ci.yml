name: CI
# full-suite-exempt: 1s measured on run 32912772563 (2026-08-25)
# RULE-2026-10-01-A: `npm test` runs a FIXED list of 8 test files (package.json), 1s
# on both node versions, so it runs on every PR and push. The fleet scanner keeps
# measuring it and reports it past 60s. app/lib/section.test.mjs is not in the
# list; that gap is tracked separately, not certified by this line.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Deterministic gates only — no API key, no network. This is the ship gate
      # for the grounding + rule-emitter core (grounding / sigmaTemplate /
      # ruleTranscribe). The BYOK LLM path is exercised out-of-band (scripts/smoke-live.mjs).
      - run: npm test
      - run: npm run build
